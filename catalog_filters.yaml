# Catalog Filters for Dynamic Model Catalog Selection (§4.5.4)
#
# Operator-level overrides for the model catalog. Even with the full
# catalog open, operators need controls for provider reliability,
# privacy concerns, terms of service, or cost controls.
version: 1
# Models or providers NEVER to use, regardless of profile match
blocklist:
  providers: []
  models:
    # Gov-shutdown / dead 2026 (US export restriction). OpenRouter still LISTS it but
    # every call 404s "no endpoints". Reversible: delete these two lines if it returns. (#331 1a)
    - "openrouter/anthropic/claude-fable-5"
    # Removed from pool — qwen2.5:1.5b routing catastrophe (punch list #1)
    - "ollama/qwen2.5:1.5b"
    - "openrouter/openai/gpt-4o-mini-search-preview"
    - "openrouter/openai/gpt-4o-search-preview"
    # Safety classifiers - these ARE the guardrail, not a model
    - "openrouter/meta-llama/llama-guard-2-8b"
    - "openrouter/meta-llama/llama-guard-3-8b"
    - "openrouter/meta-llama/llama-guard-4-12b"
    - "openrouter/openai/gpt-oss-safeguard-20b"
    # Search/research-optimized - wrong tool for Syl
    - "openrouter/relace/relace-search"
    - "openrouter/perplexity/sonar-pro-search"
    - "openrouter/perplexity/sonar-deep-research"
    - "openrouter/openai/o3-deep-research"
    - "openrouter/openai/o4-mini-deep-research"
    - "openrouter/alibaba/tongyi-deepresearch-30b-a3b"
  # [2026-10-15] Josh's standing rule: NO frontier model per token — "OpenRouter is for open-source models ONLY";
  # frontier models are used only through subscriptions already paid for. Regexes (re.search, case-insensitive)
  # against the full TID id. Open-weights models from the same labs stay eligible (Gemma, gpt-oss).
  model_patterns:
    - "^openrouter/anthropic/"              # Claude (subscription only)
    - "^openrouter/openai/(?!gpt-oss)"      # GPT / o-series / codex; gpt-oss is open weights
    - "^openrouter/x-ai/"                   # Grok (subscription only)
    - "grok"                                # Grok via any other provider (e.g. venice/grok-*)
    - "^openrouter/google/gemini"           # Gemini (Gemma stays: open weights)
    - "^openrouter/amazon/nova"             # Amazon Nova
    - "^openrouter/cohere/command"          # Cohere Command A
    - "^openrouter/mistralai/mistral-large" # Mistral Large (Josh 2026-10-15: block to be safe)
    - "^openrouter/openrouter/(auto|auto-beta|pareto-code)$"  # OpenRouter's routers can pick a frontier model
# If non-empty, ONLY these providers are eligible (overrides blocklist)
allowlist:
  providers:
    - "openrouter"
    # - "venice"   # [2026-06-25] DISCONNECTED (Josh): unfunded last-ditch. floor=30 kept its
    #              # prio-35 private-tier models over funded OR -> malforms. Re-add this line to reconnect.
    - "huggingface"  # Added 2026-04-19 — broaden pool when OR+Venice both hit rate limits
hard_ceiling:
  max_cost_per_1m_input_tokens: 20.00
  max_cost_per_1m_output_tokens: 60.00
